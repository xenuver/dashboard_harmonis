version: '3.8' 
services: 
  frontend:
    build:
      context: ./frontend
      dockerfile: ./nginx/Dockerfile.alpine-frontend
      args:
        VITE_BACKEND_PROTOCOL: current
        VITE_BACKEND_HOSTNAME: current
        VITE_BACKEND_PORT: current
    restart: unless-stopped
    networks:
      - outside_access
      - backend_access
    volumes:
      - type: bind
        source: ./frontend/nginx/config/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    ports:
      - 15001:8080

  backend:
    build: 
      context: ./backend
      dockerfile: ./Dockerfile.alpine
    restart: unless-stopped
    networks:
      - backend_access
    env_file:
      - ./.env.backend
    volumes:
      - type: bind
        source: ./backend/php-fpm/config/custom.ini
        target: /usr/local/etc/php/conf.d/custom.ini
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /var/run/mysqld/mysqld.sock
        target: /var/run/mysqld/mysqld.sock
        bind:
          create_host_path: false

networks:
  outside_access:
    driver: bridge
  backend_access:
    driver: bridge
    internal: true
