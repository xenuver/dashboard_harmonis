version: '3.8' 
services: 
  frontend:
    build:
      context: ./frontend
      dockerfile: ./nginx/Dockerfile.alpine-frontend
      args: # Penjelasan setiap args dapat dilihat di file .env dalam folder frontend
        VITE_BACKEND_PROTOCOL: current
        VITE_BACKEND_HOSTNAME: current
        VITE_BACKEND_PORT: current
    restart: unless-stopped
    networks:
      - outside_access
      - backend_access
    volumes:
      - type: bind
        source: ./frontend/nginx/config/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    ports:
      - 15001:8080

  backend: # Semua contoh .env dapat dilihat di folder beckend. Disarankan menggunakan .env.prod.example di lingkungan production
    build: 
      context: ./backend
      dockerfile: ./Dockerfile.alpine
    restart: unless-stopped
    networks:
      - backend_access
      - database_access
    volumes:
      - type: bind
        source: ./backend/php-fpm/config/custom.ini
        target: /usr/local/etc/php/conf.d/custom.ini
        read_only: true
        bind:
          create_host_path: false

  database:
    image: mariadb:lts
    restart: unless-stopped
    networks:
      - backend_access
      - database_access
    environment:
      - MARIADB_DATABASE=dashboard_harmonis
      - MARIADB_ROOT_PASSWORD=admin # sangat disarankan untuk hapus env ini menggunakan docker compose override, kemudian atur password baru dalam file env
      - MARIADB_USER=laravel # disarankan untuk hapus env ini menggunakan docker compose override, kemudian atur username baru dalam file env. Pastikan username sama dengan username database Laravel!
      - MARIADB_PASSWORD=laravel # sama juga dengan password root, tetapi pastikan password sama dengan pasword database Laravel!
    volumes:
      - dashboard_harmonis_db:/var/lib/mysql

networks:
  outside_access:
    driver: bridge
  backend_access:
    driver: bridge
    internal: true
  database_access:
    driver: bridge
    internal: true

volumes:
  dashboard_harmonis_db:
